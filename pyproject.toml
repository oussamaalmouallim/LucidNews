[project]
name = "lucidnews"
version = "0.1.0"
description = "LucidNews — reliable tech intelligence: collect, verify, classify, summarize and deliver IT news"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "feedparser>=6.0.11",
    "anthropic>=0.39.0",
    "openai>=1.54.0",
    "google-genai>=0.3.0",
    "pydantic>=2.9.0",
    "python-dateutil>=2.9.0",
    "rich>=13.9.0",
    "tenacity>=9.0.0",
    "python-dotenv>=1.0.0",
    "ddgs>=7.0.0",
    "beautifulsoup4>=4.12.0",
    "markdown>=3.10.2",
    "mcp>=1.0.0",
    "opencc-python-reimplemented>=0.1.7",
    "trafilatura>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]
twitter = [
    "playwright>=1.40.0",
    "playwright-stealth>=1.0.0",
]
[project.scripts]
lucidnews = "lucidnews.main:main"
lucidnews-mcp = "lucidnews.mcp.server:main"
lucidnews-wizard = "lucidnews.setup.wizard:main"
lucidnews-webhook = "lucidnews.services.webhook_cli:main"
lucidnews-sources = "lucidnews.sources_cli:main"
lucidnews-api = "lucidnews.web_api:main"
lucidnews-public = "lucidnews.public_api:main"
lucidnews-users = "lucidnews.auth.cli:main"
lucidnews-eval = "lucidnews.evaluation.cli:main"
lucidnews-reassess = "lucidnews.reassess_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lucidnews"]

[tool.hatch.build.targets.wheel.force-include]
"profiles" = "lucidnews/_builtin_profiles"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]
